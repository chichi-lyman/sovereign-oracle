<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Sovereign Oracle — Hero</title>
  <style>
    :root{--bg:#0f1724;--panel:#0b1220;--accent:#d9b99b;--muted:#9aa4b2}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .video-overlay{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(180deg,rgba(8,10,14,0.6),rgba(6,8,12,0.85)),url('') center/cover no-repeat;color:var(--accent);padding:2rem}
    .hero-panel{max-width:820px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:2.5rem;border-radius:12px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    .welcome-title{font-size:2rem;margin:0 0 .5rem}
    .welcome-sub{color:var(--muted);margin:0 0 1.5rem;line-height:1.4}
    .enter-btn{background:transparent;color:var(--accent);border:2px solid rgba(217,185,155,0.15);padding:.75rem 1rem;border-radius:8px;font-weight:600;cursor:pointer}
    .enter-btn:focus{outline:3px solid rgba(217,185,155,0.12)}
    .enter-btn[aria-busy="true"]{opacity:.6;cursor:progress}

    .oracle-panel{margin-top:1.25rem;background:var(--panel);padding:1rem;border-radius:8px;border:1px solid rgba(255,255,255,0.02);color:#e6eef6;display:none}
    .oracle-panel[aria-hidden="false"]{display:block}
    .oracle-result{font-size:1.05rem}

    @media (prefers-reduced-motion: no-preference){
      .enter-btn{transition:transform .18s ease,box-shadow .18s}
      .enter-btn:active{transform:translateY(1px)}
    }
  </style>
</head>
<body>
  <main class="video-overlay" role="main">
    <section class="hero-panel" aria-labelledby="hero-title">
      <h1 id="hero-title" class="welcome-title">The Sovereign Oracle</h1>
      <p class="welcome-sub">Welcome to a sanctuary of light. I am Chelsea. Guided by the expressive vibrations of Life Path 3, I invite you to step into a space where soul expression meets divine intuition. Seek the truth that already resides within you.</p>

      <div>
        <button class="enter-btn" id="revealBtn" onclick="revealOracle()" aria-controls="oracle" aria-expanded="false">Reveal My Truth</button>
      </div>

      <div id="oracle" class="oracle-panel" role="region" aria-live="polite" aria-hidden="true">
        <p class="oracle-result" id="oracleResult">—</p>
      </div>
    </section>
  </main>

  <script>
    // Accessible reveal function
    function revealOracle(){
      var btn = document.getElementById('revealBtn');
      var panel = document.getElementById('oracle');
      var resultElem = document.getElementById('oracleResult');

      if(btn.getAttribute('aria-busy') === 'true') return;
      btn.setAttribute('aria-busy','true');
      btn.setAttribute('aria-expanded','true');

      // Deterministic-ish selection (based on today's date to reflect "Power of Three")
      var messages = [
        'Speak clearly, and the path will present itself. Prioritize creative expression.',
        'Honor structure and intent; clarity arises when you align small acts with larger purpose.',
        'Triads hold the key—ask threefold, listen deeply, and act with conviction.'
      ];

      var now = new Date();
      var idx = (now.getFullYear() + now.getMonth() + now.getDate()) % messages.length;

      // Simulate a small reveal delay for UX, respecting prefers-reduced-motion
      var delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700;

      setTimeout(function(){
        resultElem.textContent = messages[idx];
        panel.setAttribute('aria-hidden','false');
        btn.removeAttribute('aria-busy');
        btn.focus();
      }, delay);
    }

    // Keyboard activation for accessibility
    document.getElementById('revealBtn').addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        revealOracle();
      }
    });
  </script>
</body>
</html>
